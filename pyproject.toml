[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adcp"
version = "0.2.0"
description = "Experimental accumulated-distress care sidecar for AI conversations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph J. M. Walker" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
